name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: Source and installed delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:delivery
      - run: npm run check:delivery
      - name: Fixed app-authoring material matches reviewed files
        run: node desirecore/release.js --check
  regression:
    name: Upstream and managed regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The retained upstream suite is a required gate. No failure masking or production fixtures.
      - run: node --test --test-concurrency=2
  runtime:
    name: Native dependency fixture (${{ matrix.target }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install declared Linux headless system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 libnspr4 libnss3 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
      - name: Verify actual runner architecture and prepare pinned assets
        shell: bash
        env:
          EXPECTED_RUNTIME_TARGET: ${{ matrix.target }}
          APP_DATA_DIR: ${{ runner.temp }}/video-editing-runtime
        run: |
          node -e 'if(process.platform+"-"+process.arch!==process.env.EXPECTED_RUNTIME_TARGET)process.exit(1)'
          node desirecore/cli.mjs setup-runtime
          node .github/scripts/runtime-smoke.js
      # Source hashes, logs and native archives remain on this run's local worker; no Actions artifacts.
